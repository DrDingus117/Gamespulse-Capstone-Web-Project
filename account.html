<!DOCTYPE html>
<html lang="en">
<head>
  <title>Sign In | GamesPulse</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="output.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-gray-200 leading-relaxed">
  <header class="bg-gray-800 border-b border-gray-700">
    <div class="max-w-6xl mx-auto flex items-center justify-between p-4">
      <a href="index.html" class="text-xl font-bold text-gray-50">GamesPulse</a>
      <nav id="nav-list" aria-label="Main">
        <ul class="flex gap-6">
          <li><a href="index.html" class="text-sky-300 hover:underline focus:outline-none focus:ring-2 focus:ring-sky-300">Home</a></li>
          <li><a href="about.html" class="text-sky-300 hover:underline focus:outline-none focus:ring-2 focus:ring-sky-300">About</a></li>
          <li><a href="credits.html" class="text-sky-300 hover:underline focus:outline-none focus:ring-2 focus:ring-sky-300">Credits</a></li>
          <li><a href="account.html" aria-current="page" class="text-sky-300 underline focus:outline-none focus:ring-2 focus:ring-sky-300">Sign In</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="max-w-md mx-auto p-6 space-y-6">
    <h1 class="text-4xl font-bold text-gray-50">Sign Up / Log In</h1>

    <form id="accountForm" class="space-y-4">
      <div>
        <label for="fname" class="block mb-1">Account name</label>
        <input type="text" id="fname" name="fname" required autocomplete="username"
               class="w-full bg-gray-800 border border-gray-600 text-gray-100 rounded p-2 focus:outline-none focus:ring-2 focus:ring-sky-300">
      </div>
      <div>
        <label for="email" class="block mb-1">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email"
               class="w-full bg-gray-800 border border-gray-600 text-gray-100 rounded p-2 focus:outline-none focus:ring-2 focus:ring-sky-300">
      </div>
      <div>
        <label for="ps" class="block mb-1">Password</label>
        <input type="password" id="ps" name="psw" required autocomplete="current-password"
               class="w-full bg-gray-800 border border-gray-600 text-gray-100 rounded p-2 focus:outline-none focus:ring-2 focus:ring-sky-300">
      </div>

      <div class="flex gap-4">
        <button type="button" onclick="signUp()"
                class="bg-indigo-500 hover:bg-indigo-400 text-white px-4 py-2 rounded focus:outline-none focus:ring-2 focus:ring-sky-300">Sign Up</button>
        <button type="button" onclick="login()"
                class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded focus:outline-none focus:ring-2 focus:ring-sky-300">Log In</button>
      </div>

      <p class="error text-red-300" role="alert"></p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
